<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Food Ordering System</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <h1>Online Food Ordering System</h1>
    <div class="header-actions">
      <!-- 🔍 Food Search Bar -->
      <div style="text-align:center; margin-right: 20px;">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search for food..." 
          style="padding: 8px; width: 250px; font-size: 16px;" 
          oninput="searchItems()" 
        />
        <button onclick="searchItems()" style="padding: 8px 16px;">Search</button>
      </div>
      <!-- 🛒 Cart icon -->
      <a href="mycart.html" class="cart-button" title="Cart">
        <i class="fas fa-shopping-cart"></i>
      </a>
     
    </div>
  </header>

  <div class="main-container">
    <!-- Left Filter Panel -->
    <aside class="filter-panel">
      <button class="filter-button" onclick="toggleFilterOptions()">Filter ▼</button>
      <div class="filter-options" id="filterOptions">
        <button onclick="togglePriceOptions()">Filter by Price</button>
        <div id="priceOptions" class="sub-options">
          <button onclick="sortByPrice('lowToHigh')">Low to High</button>
          <button onclick="sortByPrice('highToLow')">High to Low</button>
        
      </div>
    </aside>

    <!-- Right Cards Area -->
    <main class="card-container" id="cardContainer">
      <!-- Cards will be inserted here using JS -->
    </main>
  </div>

<script>
  let menuData = [];
  let currentViewData = [];

  function toggleFilterOptions() {
    const filterOptions = document.getElementById('filterOptions');
    filterOptions.classList.toggle('active');
  }

  function togglePriceOptions() {
    const priceOptions = document.getElementById('priceOptions');
    priceOptions.classList.toggle('active');
  }

  function displayMenu(items) {
    const cardContainer = document.getElementById('cardContainer');
    cardContainer.innerHTML = '';
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${item.imageUrl}" alt="${item.name}">
        <h3>${item.name}</h3>
        <p>Category: ${item.category}</p>
        <p>Price: ₹${item.price}</p>
        <button onclick='addToCart(${JSON.stringify(item)})'>Add to Cart</button>
      `;
      cardContainer.appendChild(card);
    });
  }

  function sortByPrice(order) {
    const sorted = [...currentViewData];
    sorted.sort((a, b) => order === 'lowToHigh' ? a.price - b.price : b.price - a.price);
    displayMenu(sorted);
  }

  function searchItems() {
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    if (keyword === "") {
      currentViewData = [...menuData];
    } else {
      currentViewData = menuData.filter(item =>
        item.name.toLowerCase().includes(keyword) ||
        item.category.toLowerCase().includes(keyword)
      );
    }
    displayMenu(currentViewData);
  }

  function filterByCategory(category) {
    currentViewData = menuData.filter(item => item.category.toLowerCase() === category.toLowerCase());
    displayMenu(currentViewData);
  }

  function resetFilters() {
    currentViewData = [...menuData];
    document.getElementById("searchInput").value = "";
    displayMenu(currentViewData);
  }

  function addToCart(item) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart.push(item);
    localStorage.setItem('cart', JSON.stringify(cart));
    showPopup(`${item.name} added to cart successfully!`);
  }

  function showPopup(message) {
    const popup = document.createElement('div');
    popup.className = 'popup';
    popup.textContent = message;
    document.body.appendChild(popup);
    setTimeout(() => popup.remove(), 2000);
  }

  // Initial fetch
  fetch("/menu")
    .then(response => response.json())
    .then(data => {
      menuData = data;
      currentViewData = [...menuData];
      displayMenu(currentViewData);
    })
    .catch(error => {
      console.error("Error fetching menu:", error);
    });
</script>
</body>
</html>
